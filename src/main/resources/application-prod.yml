# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod (set on the `app` service in deploy/compose.prod.yml).
spring:
  datasource:
    hikari:
      # Fail fast rather than block callers when the pool is exhausted or the DB is unreachable.
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1200000
      # Log a stack trace when a connection is held longer than this — catches leaks in prod.
      leak-detection-threshold: 30000

management:
  endpoints:
    web:
      exposure:
        # Trim the surface area in prod; drop what you don't scrape.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

# No API explorer on a public host; the spec is still generated at build time if you need it elsewhere.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.example.company: INFO
